<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Motor de presentaciones estático con contenidos interactivos."
    >
    <title>Presentación</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/nucleo/base.css">
    <link rel="stylesheet" href="css/nucleo/marco.css">
    <link rel="stylesheet" href="css/nucleo/indice.css">
    <link rel="stylesheet" href="css/tipos/portada.css">
    <link rel="stylesheet" href="css/tipos/contenido.css">
    <link rel="stylesheet" href="css/diapositivas/interconexiones.css">
  </head>
  <body>
    <a class="presentacion-salto" href="#presentacion-escenario">
      Ir al contenido de la diapositiva
    </a>

    <div class="presentacion-marco">
      <header class="presentacion-encabezado">
        <div class="presentacion-titulos">
          <p class="presentacion-sobrelinea" id="presentacion-sobrelinea">
            Presentación
          </p>
          <h1 class="presentacion-titulo" id="presentacion-titulo">
            Índice
          </h1>
          <p class="presentacion-bajada" id="presentacion-bajada">
            Elegí una diapositiva para comenzar.
          </p>
        </div>

        <div
          class="presentacion-controles"
          aria-label="Controles de la presentación"
        >
          <button
            class="presentacion-control presentacion-control--indice"
            id="presentacion-boton-indice"
            type="button"
            aria-pressed="true"
            aria-label="Cerrar índice"
            title="Abrir o cerrar índice (M)"
          >
            <span aria-hidden="true">☰</span>
            <span>Índice</span>
          </button>
          <button
            class="presentacion-control presentacion-control--modo"
            id="presentacion-boton-modo"
            type="button"
            aria-pressed="false"
            aria-label="Activar modo presentación"
            title="Activar modo presentación (P)"
          >
            <span aria-hidden="true">⛶</span>
            <span class="presentacion-control__etiqueta">
              Modo presentación
            </span>
          </button>
          <div
            class="presentacion-acciones-contenido"
            id="presentacion-acciones-contenido"
          ></div>
        </div>
      </header>

      <main
        class="presentacion-escenario"
        id="presentacion-escenario"
        tabindex="-1"
      ></main>

      <div
        class="presentacion-progreso"
        id="presentacion-progreso"
        aria-live="polite"
        hidden
      >
        <span
          class="presentacion-contador"
          id="presentacion-contador"
        ></span>
        <span
          class="presentacion-pasos"
          id="presentacion-pasos"
          aria-label="Progreso dentro de la diapositiva"
        ></span>
      </div>
    </div>

    <script src="js/nucleo/espacio-nombres.js"></script>
    <script src="js/nucleo/registro.js"></script>
    <script src="js/nucleo/enrutador.js"></script>
    <script src="js/nucleo/pasos.js"></script>
    <script src="js/nucleo/modo-presentacion.js"></script>
    <script src="js/nucleo/teclado.js"></script>
    <script src="js/tipos/portada.js"></script>
    <script src="js/tipos/contenido.js"></script>
    <script src="js/diapositivas/interconexiones/datos.js"></script>
    <script src="js/diapositivas/interconexiones/vista.js"></script>
    <script src="guion.js"></script>
    <script src="js/nucleo/marco.js"></script>
  </body>
</html>
