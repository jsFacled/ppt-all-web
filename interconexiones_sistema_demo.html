<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interconexiones del Sistema</title>
<style>
:root{--bg:#f6f8fc;--panel:#fff;--text:#14213d;--muted:#667085;--border:#d9e0eb;--shadow:0 16px 40px rgba(16,36,95,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{padding:22px 28px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{margin:0;font-size:clamp(26px,3vw,44px);line-height:1.05;color:#10245f}.subtitle{margin:8px 0 0;max-width:850px;color:var(--muted);font-size:15px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}button{border:1px solid var(--border);background:#fff;color:#24324a;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700;transition:.2s ease}button:hover{transform:translateY(-1px);border-color:#aab6cc;box-shadow:0 7px 20px rgba(16,36,95,.08)}button.primary{background:#10245f;color:#fff;border-color:#10245f}main{padding:0 24px 24px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;min-height:0}.map-shell{position:relative;min-height:720px;background:var(--panel);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.map-stage{position:absolute;inset:0;min-width:960px;min-height:680px}#connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.department{position:absolute;transform:translate(-50%,-50%);width:210px;min-height:72px;border:3px solid var(--dept-color);background:color-mix(in srgb,var(--dept-color) 9%,white);border-radius:18px;padding:15px 14px;display:grid;place-items:center;text-align:center;font-weight:800;color:var(--dept-color);cursor:pointer;user-select:none;transition:transform .28s ease,opacity .28s ease,filter .28s ease,box-shadow .28s ease,background .28s ease;z-index:4}.department:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 10px 24px rgba(16,36,95,.12)}.department.selected{transform:translate(-50%,-50%) scale(1.13);background:color-mix(in srgb,var(--dept-color) 15%,white);box-shadow:0 18px 36px color-mix(in srgb,var(--dept-color) 25%,transparent);z-index:7}.department.related{opacity:1;filter:saturate(1);z-index:5}.department.faded{opacity:.28;filter:grayscale(.95) saturate(.2);transform:translate(-50%,-50%) scale(.96);z-index:2}.department.external{width:130px;min-height:56px;border-radius:999px;font-size:14px}.hint{position:absolute;left:20px;bottom:18px;color:#758198;font-size:13px;z-index:8;background:rgba(255,255,255,.9);border:1px solid var(--border);padding:8px 12px;border-radius:999px}.info{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:20px;align-self:stretch;min-height:720px;overflow:auto}.info h2{margin:0 0 6px;color:#10245f;font-size:24px}.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 10px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800;margin-bottom:18px}.section{margin-top:18px}.section h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#667085}.relation{border-left:4px solid var(--relation-color);background:#f9fafb;border-radius:10px;padding:10px 12px;margin-bottom:9px;font-size:14px;line-height:1.35}.relation strong{color:#1d2939}.empty{color:#98a2b3;font-style:italic}.legend{margin-top:22px;border-top:1px solid var(--border);padding-top:16px;color:var(--muted);font-size:13px;line-height:1.45}.edge{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:draw .45s ease forwards}.edge-label rect{fill:#fff;stroke-width:1.5;rx:9;ry:9}.edge-label text{font-size:12px;fill:#25324a;font-weight:700;dominant-baseline:middle;text-anchor:middle}@keyframes draw{from{opacity:0;stroke-dasharray:18 16}to{opacity:1;stroke-dasharray:0}}@media(max-width:1050px){main{grid-template-columns:1fr}.map-shell{overflow-x:auto}.info{min-height:auto}}
</style>
</head>
<body>
<div class="app"><header><div><h1>Interconexiones del Sistema</h1><p class="subtitle">Seleccioná un sector para ver sólo sus relaciones. El sector elegido queda en primer plano, los relacionados en segundo plano y los demás se atenúan.</p></div><div class="toolbar"><button id="resetBtn">Restablecer</button><button id="allBtn">Ver todas</button><button id="nextBtn" class="primary">Siguiente sector</button></div></header><main><section class="map-shell" aria-label="Mapa interactivo de sectores"><div class="map-stage" id="mapStage"><svg id="connections" aria-hidden="true"></svg><div class="hint">Hacé clic en un sector</div></div></section><aside class="info" id="infoPanel"></aside></main></div>
<script>
const departments={pmo:{name:"PMO",color:"#5B6B82",x:50,y:8,external:true},direccion:{name:"Dirección y Directorio",color:"#123B9B",x:50,y:22},rrhh:{name:"RRHH / Talento",color:"#0A8754",x:17,y:42},compliance:{name:"Compliance / Legales",color:"#D99A00",x:83,y:42},tecnologia:{name:"Tecnología / IT / Data",color:"#FF6B00",x:50,y:50},research:{name:"Research / Productos / Mesa",color:"#673AB7",x:17,y:72},comercial:{name:"Comercial / Asesores",color:"#E91E63",x:83,y:72},backoffice:{name:"Back Office, Operaciones y Riesgo",color:"#1677D2",x:50,y:88}};
const connections=[
{from:"pmo",to:"direccion",label:"Estado consolidado de avance y riesgos escalados"},
{from:"direccion",to:"rrhh",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},{from:"direccion",to:"compliance",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},{from:"direccion",to:"tecnologia",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},{from:"direccion",to:"research",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},{from:"direccion",to:"comercial",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},{from:"direccion",to:"backoffice",label:"Aprobaciones, presupuesto, patrocinio y criterios de riesgo"},
{from:"compliance",to:"rrhh",label:"Insumos para el diagnóstico de brechas"},{from:"research",to:"rrhh",label:"Insumos para el diagnóstico de brechas"},{from:"tecnologia",to:"rrhh",label:"Sandbox y plataforma de formación"},{from:"comercial",to:"rrhh",label:"Feedback de adopción"},{from:"rrhh",to:"comercial",label:"Programas de formación técnica y humana"},{from:"rrhh",to:"direccion",label:"Reportes de adopción y clima"},
{from:"tecnologia",to:"compliance",label:"Diseño técnico a validar"},{from:"research",to:"compliance",label:"Racionales a auditar"},{from:"backoffice",to:"compliance",label:"Reglas de riesgo a revisar"},{from:"compliance",to:"tecnologia",label:"Criterios de human-in-the-loop y trazabilidad"},{from:"compliance",to:"rrhh",label:"Validación de los Módulos C y D"},{from:"compliance",to:"direccion",label:"Riesgo regulatorio"},
{from:"research",to:"tecnologia",label:"Contenido y racionales para el RAG"},{from:"backoffice",to:"tecnologia",label:"Reglas de negocio y riesgo"},{from:"compliance",to:"tecnologia",label:"Criterios de gobernanza"},{from:"tecnologia",to:"comercial",label:"Chatbot, CRM y herramientas"},{from:"tecnologia",to:"research",label:"RAG operativo"},{from:"tecnologia",to:"backoffice",label:"Motores de conciliación y reglas"},{from:"tecnologia",to:"rrhh",label:"Plataforma de formación"},
{from:"tecnologia",to:"research",label:"RAG y herramientas operativas"},{from:"research",to:"tecnologia",label:"Contenido y casos de uso para entrenar la IA"},{from:"research",to:"comercial",label:"Racionales de inversión y research"},
{from:"rrhh",to:"comercial",label:"Formación dual"},{from:"tecnologia",to:"comercial",label:"Chatbot/copiloto y CRM"},{from:"research",to:"comercial",label:"Contenido y racionales"},{from:"comercial",to:"direccion",label:"NPS, retención y adopción real"},{from:"comercial",to:"rrhh",label:"Feedback de uso para ajustar la formación"},
{from:"tecnologia",to:"backoffice",label:"Integración de los motores de conciliación"},{from:"backoffice",to:"tecnologia",label:"Reglas de riesgo y límites operativos"},{from:"backoffice",to:"comercial",label:"Ejecución de los rebalanceos aprobados"}
];
const stage=document.getElementById("mapStage"),svg=document.getElementById("connections"),infoPanel=document.getElementById("infoPanel"),resetBtn=document.getElementById("resetBtn"),allBtn=document.getElementById("allBtn"),nextBtn=document.getElementById("nextBtn");let selected=null,showAll=false;const order=Object.keys(departments);
function createNodes(){for(const[id,dept]of Object.entries(departments)){const el=document.createElement("button");el.className="department"+(dept.external?" external":"");el.id=`dept-${id}`;el.style.left=`${dept.x}%`;el.style.top=`${dept.y}%`;el.style.setProperty("--dept-color",dept.color);el.textContent=dept.name;el.addEventListener("click",()=>selectDepartment(id));stage.appendChild(el)}}
function getNodeCenter(id){const el=document.getElementById(`dept-${id}`),sr=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-sr.left+r.width/2,y:r.top-sr.top+r.height/2,width:r.width,height:r.height}}
function boundaryPoint(c,t){const dx=t.x-c.x,dy=t.y-c.y,hw=c.width/2,hh=c.height/2,s=1/Math.max(Math.abs(dx)/hw,Math.abs(dy)/hh);return{x:c.x+dx*s,y:c.y+dy*s}}
function routeFor(conn){const from=getNodeCenter(conn.from),to=getNodeCenter(conn.to),start=boundaryPoint(from,to),end=boundaryPoint(to,from),dx=end.x-start.x,dy=end.y-start.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,reverse=connections.some(c=>c.from===conn.to&&c.to===conn.from),sign=conn.from<conn.to?1:-1,offset=reverse?30*sign:0;if(conn.from==="comercial"&&conn.to==="direccion"){const rx=Math.max(start.x,end.x)+110;return{d:`M ${start.x} ${start.y} L ${rx} ${start.y} L ${rx} ${end.y} L ${end.x} ${end.y}`,labelX:rx-10,labelY:end.y+30}}const midX=(start.x+end.x)/2+nx*offset,midY=(start.y+end.y)/2+ny*offset,horizontal=Math.abs(dx)>Math.abs(dy),d=horizontal?`M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`:`M ${start.x} ${start.y} L ${start.x} ${midY} L ${end.x} ${midY} L ${end.x} ${end.y}`;return{d,labelX:end.x-(dx/len)*90,labelY:end.y-(dy/len)*52}}
function shortLabel(text){if(text.length<=46)return[text];const words=text.split(" ");let a="",b="";for(const w of words){if((a+" "+w).trim().length<=31&&!b)a=(a+" "+w).trim();else b=(b+" "+w).trim()}return[a,b].filter(Boolean)}
function renderConnections(){svg.innerHTML="";const visible=showAll?connections:selected?connections.filter(c=>c.from===selected||c.to===selected):[];svg.setAttribute("viewBox",`0 0 ${stage.clientWidth} ${stage.clientHeight}`);const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");svg.appendChild(defs);[...new Set(visible.map(c=>c.from))].forEach(id=>{const m=document.createElementNS("http://www.w3.org/2000/svg","marker");m.setAttribute("id",`arrow-${id}`);m.setAttribute("markerWidth","11");m.setAttribute("markerHeight","11");m.setAttribute("refX","9");m.setAttribute("refY","5.5");m.setAttribute("orient","auto");m.setAttribute("markerUnits","strokeWidth");const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M0,0 L11,5.5 L0,11 z");p.setAttribute("fill",departments[id].color);m.appendChild(p);defs.appendChild(m)});visible.forEach((conn,index)=>{const route=routeFor(conn),path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",route.d);path.setAttribute("class","edge");path.setAttribute("stroke",departments[conn.from].color);path.setAttribute("marker-end",`url(#arrow-${conn.from})`);path.style.animationDelay=`${index*45}ms`;svg.appendChild(path);const lines=shortLabel(conn.label),maxChars=Math.max(...lines.map(l=>l.length)),w=Math.min(245,Math.max(110,maxChars*6.4+22)),h=18+lines.length*15,g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","edge-label");const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");rect.setAttribute("x",route.labelX-w/2);rect.setAttribute("y",route.labelY-h/2);rect.setAttribute("width",w);rect.setAttribute("height",h);rect.setAttribute("stroke",departments[conn.from].color);const text=document.createElementNS("http://www.w3.org/2000/svg","text");text.setAttribute("x",route.labelX);text.setAttribute("y",route.labelY-((lines.length-1)*7));lines.forEach((line,i)=>{const t=document.createElementNS("http://www.w3.org/2000/svg","tspan");t.setAttribute("x",route.labelX);t.setAttribute("dy",i===0?"0":"15");t.textContent=line;text.appendChild(t)});g.appendChild(rect);g.appendChild(text);svg.appendChild(g)})}
function updateNodeStates(){const related=new Set;if(selected){for(const c of connections){if(c.from===selected)related.add(c.to);if(c.to===selected)related.add(c.from)}}for(const id of Object.keys(departments)){const el=document.getElementById(`dept-${id}`);el.classList.remove("selected","related","faded");if(!selected||showAll)el.classList.add("related");else if(id===selected)el.classList.add("selected");else if(related.has(id))el.classList.add("related");else el.classList.add("faded")}}
function renderInfo(){if(showAll){infoPanel.innerHTML=`<h2>Sistema completo</h2><div class="badge">37 flechas individuales</div><p>Se muestran todas las conexiones declaradas. Las flechas mantienen el color de su sector de origen.</p><div class="legend">Esta vista es más densa. Para analizar el flujo con claridad, conviene seleccionar un sector específico.</div>`;return}if(!selected){infoPanel.innerHTML=`<h2>Mapa general</h2><div class="badge">Sin sector seleccionado</div><p>Seleccioná un sector para ver sólo sus relaciones entrantes y salientes.</p><div class="legend"><strong>Reglas visuales</strong><br>La flecha tiene el color del sector de origen. No se usan flechas de doble punta. Las relaciones recíprocas se dibujan como dos flechas independientes.</div>`;return}const dept=departments[selected],incoming=connections.filter(c=>c.to===selected),outgoing=connections.filter(c=>c.from===selected);const make=(items,incomingMode)=>items.length?items.map(c=>{const other=incomingMode?departments[c.from]:departments[c.to],color=incomingMode?departments[c.from].color:departments[selected].color;return`<div class="relation" style="--relation-color:${color}"><strong>${other.name}</strong><br>${c.label}</div>`}).join(""):`<p class="empty">No hay relaciones registradas.</p>`;infoPanel.innerHTML=`<h2>${dept.name}</h2><div class="badge">${incoming.length+outgoing.length} conexiones asociadas</div><div class="section"><h3>Recibe de</h3>${make(incoming,true)}</div><div class="section"><h3>Entrega a</h3>${make(outgoing,false)}</div><div class="legend">Los sectores no relacionados quedan atenuados. Podés hacer clic directamente en cualquier sector visible para cambiar de foco.</div>`}
function selectDepartment(id){selected=id;showAll=false;location.hash=id;updateNodeStates();renderConnections();renderInfo()}function resetMap(){selected=null;showAll=false;history.replaceState(null,"",location.pathname);updateNodeStates();renderConnections();renderInfo()}resetBtn.addEventListener("click",resetMap);allBtn.addEventListener("click",()=>{selected=null;showAll=true;updateNodeStates();renderConnections();renderInfo()});nextBtn.addEventListener("click",()=>{showAll=false;const i=selected?order.indexOf(selected):-1;selectDepartment(order[(i+1)%order.length])});window.addEventListener("resize",renderConnections);window.addEventListener("keydown",e=>{if(e.key==="Escape")resetMap();if(e.key==="ArrowRight")nextBtn.click();if(e.key==="ArrowLeft"){showAll=false;const i=selected?order.indexOf(selected):0;selectDepartment(order[(i-1+order.length)%order.length])}});createNodes();const hash=location.hash.replace("#","");if(departments[hash])selected=hash;updateNodeStates();requestAnimationFrame(()=>{renderConnections();renderInfo()});
</script>
</body>
</html>
